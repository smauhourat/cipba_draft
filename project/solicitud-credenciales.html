<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Solicitud de credenciales | CIPBA – Distrito VII</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Lato', sans-serif; background: #f7faf9; color: #373d3e; overflow-x: hidden; }
  a { text-decoration: none; color: inherit; }
  a:hover { color: #00705e; }
  button { cursor: pointer; border: none; font-family: inherit; }
  img { display: block; }
  ol, ul { list-style: none; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #eef2f1; }
  ::-webkit-scrollbar-thumb { background: #1a5f5c; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tramites-shell.jsx"></script>
<script type="text/babel">
const { TramitePage, Requisitos, Descargas, Costo, Ayuda, Aviso, Icon } = window;

const requisitos = [
  { t: 'Formulario CRE-2024 completo', d: 'o sus posteriores actualizaciones, para solicitar duplicado y/o actualización del carnet de matrícula o de registros especiales.' },
  { t: 'Documento de identidad (DNI)', d: 'copia escaneada. El original se solicita al retirar la credencial.' },
  { t: 'Firma y foto digitalizadas' },
  { t: 'Certificado con el plan de estudios (año)', d: 'extendido por la facultad emisora del título, en caso de no haberlo presentado oportunamente. Se cuenta con 30 días para gestionarlo ante la universidad.' },
  { t: 'Matrícula al día', d: 'encontrarse al día con los pagos de la matrícula vigente.' },
];

const descargas = [
  { label: 'Solicitud de extensión de credencial', href: 'http://www.colegioingenieros.org.ar/static/docs/matriculados/SOLICITUD%20EXTENSION%20DE%20CREDENCIAL.pdf' },
];

const App = () => (
  <TramitePage
    actual="solicitud-credenciales.html"
    hero={{
      eyebrow: 'Matrícula profesional',
      titulo: 'Solicitud de credenciales',
      breadcrumb: 'Credenciales',
      intro: 'Formulario CRE-2024 para pedir el duplicado o la actualización del carnet de matrícula y de los registros especiales.',
    }}
    aside={<>
      <Costo filas={[
        { label: 'Costo del trámite', value: 'Sin costo.' },
        { label: 'Requisito previo', value: 'Encontrarse al día con los pagos de la matrícula vigente.' },
      ]}/>
      <Ayuda/>
    </>}>

    <Requisitos titulo="Requisitos" sub="Solicitud de credenciales: CRE-2024." items={requisitos}/>

    <Aviso titulo="Antes de descargar">
      Para poder editar los documentos descargados recomendamos usar Adobe Acrobat Reader. El original del DNI se solicita al momento de retirar la credencial en la sede.
    </Aviso>

    <Descargas items={descargas}/>
  </TramitePage>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
