const PAGE = (typeof location !== 'undefined' ? (location.pathname.split('/').pop() || 'index.html') : '');

      borderBottom: '3px solid #00a48a',

                {link.label}
                {link.groups && <Icon name="chevronDown" size={12} color="#607a7c"/>}
              </a>
              {link.groups && activeMenu === link.label && (

            Matricularse <Icon name="externalLink" size={13} color="white"/>

const eventos = [

  { img: 'event-2.jpg', tag: 'Congreso', title: 'XII Congreso Provincial de Ingeniería', date: '18 Sep 2026' },
];
const tagColor = { Beneficios: C.purple, Institucional: C.deep, Capacitación: C.brandDark, Congreso: C.mute };

const Eventos = () => {
  const track = React.useRef(null);
  const [idx, setIdx] = useState(0);
  const [pages, setPages] = useState(1);
  const [h, hv] = useHover();

  const metrics = () => {
    const t = track.current; if (!t) return null;
    const card = t.firstElementChild; if (!card) return null;
    const step = (card.offsetWidth + 20) * 3;
    const max = Math.max(0, t.scrollWidth - t.clientWidth);
    return { t, step, max, pages: Math.max(1, Math.round(max / step) + 1) };
  };
  const sync = () => {
    const m = metrics(); if (!m) return;
    setPages(m.pages);
    setIdx(m.t.scrollLeft >= m.max - 1 ? m.pages - 1 : Math.min(m.pages - 1, Math.round(m.t.scrollLeft / m.step)));
  };
  useEffect(() => { sync(); window.addEventListener('resize', sync); return () => window.removeEventListener('resize', sync); }, []);
  const jump = (n) => {
    const m = metrics(); if (!m) return;
    const target = Math.max(0, Math.min(n, m.pages - 1));
    setIdx(target);
    m.t.scrollTo({ left: Math.min(target * m.step, m.max), behavior: 'smooth' });
  };
  const arrow = (dis) => ({ width: 36, height: 36, borderRadius: '50%', border: `1px solid ${C.pale2}`, background: 'white', display: 'grid', placeItems: 'center', padding: 0, cursor: dis ? 'default' : 'pointer', opacity: dis ? 0.35 : 1, transition: 'all .2s' });

  return (
    <section id="eventos" style={{ background: 'white', borderTop: `1px solid ${C.border}`, padding: '54px 0 48px' }}>
      <div style={wrap}>
        <SectionHead title="Eventos y novedades" sub="Vida institucional del Distrito: jornadas, cursos, asambleas y avisos internos para matriculados.">
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <MoreLink label="Ver listado completo"/>
            <div style={{ display: 'flex', gap: 8 }}>
              <button aria-label="Anterior" onClick={() => jump(idx - 1)} style={arrow(idx === 0)}>
                <span style={{ display: 'flex', transform: 'rotate(180deg)' }}><Icon name="chevronRight" size={15} color={C.deep}/></span>
              </button>
              <button aria-label="Siguiente" onClick={() => jump(idx + 1)} style={arrow(idx >= pages - 1)}>
                <Icon name="chevronRight" size={15} color={C.deep}/>
              </button>
            </div>
          </div>
        </SectionHead>
      </div>

      <div className="ev-track" ref={track} onScroll={sync} style={{ display: 'flex', gap: 20, overflowX: 'auto', scrollSnapType: 'x mandatory', maxWidth: 1200, margin: '0 auto', padding: '4px 24px 22px', scrollPaddingLeft: 24 }}>
        {eventos.map((e, i) => (
          <article key={i} className="ev-card" {...hv(i)} style={{
            flex: '0 0 auto', width: 'calc((100% - 40px) / 3)', scrollSnapAlign: 'start',
            border: `1px solid ${C.border}`, borderRadius: 10, overflow: 'hidden', background: 'white', cursor: 'pointer',
            transition: 'all .25s', boxShadow: h === i ? '0 10px 28px rgba(13,50,52,0.12)' : '0 2px 8px rgba(0,0,0,0.04)',
            transform: h === i ? 'translateY(-3px)' : 'none',
          }}>
            <div style={{ aspectRatio: '4 / 5', position: 'relative', background: C.gray }}>
              <img src={`assets/images/${e.img}`} alt={e.title} style={{ width: '100%', height: '100%', objectFit: 'cover', display: 'block', position: 'absolute', inset: 0 }}/>
            </div>
            <div style={{ padding: '18px 20px 20px' }}>
              <h3 style={{ fontFamily: HEAD, fontSize: 18, fontWeight: 700, color: C.deep, lineHeight: 1.25, marginBottom: 14, textWrap: 'pretty' }}>{e.title}</h3>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 10, borderTop: `1px solid ${C.gray}`, paddingTop: 13 }}>
                <span style={{ fontSize: 12.5, color: C.mute2 }}>{e.date}</span>
                <span style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 13, fontWeight: 700, color: C.brandDark }}>Ver detalle <Icon name="chevronRight" size={12} color={C.brandDark}/></span>
              </div>
            </div>
          </article>
        ))}
      </div>

      <div style={{ ...wrap, display: 'flex', gap: 7 }}>
        {Array.from({ length: pages }).map((_, i) => (
          <button key={i} aria-label={`Ir al grupo ${i + 1}`} onClick={() => jump(i)} style={{ width: idx === i ? 24 : 9, height: 9, borderRadius: 20, border: 'none', padding: 0, background: idx === i ? C.brand : C.pale2, transition: 'all .25s' }}/>
        ))}
      </div>
    </section>
  );
};
