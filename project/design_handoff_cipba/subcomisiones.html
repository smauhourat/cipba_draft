const getInitials = (nombre) => {
  const parts = nombre.trim().split(/\s+/);
  const apellido = parts[parts.length - 1];
  const first = parts[0];
  return (first[0] + apellido[0]).toUpperCase();
};

            </h2>
            <p style={{ fontSize: 14, color: '#3d4b63', maxWidth: 540 }}>
              Buscá por especialidad o por apellido del referente. Los datos de contacto son los oficiales informados al colegio.
            </p>
          </div>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            background: 'white', border: '1.5px solid #e0e6f0', borderRadius: 8,
            padding: '10px 14px', minWidth: 280, transition: 'border-color 0.2s',
          }}
          onFocus={e=>e.currentTarget.style.borderColor='#2563b0'}>
            <Icon name="search" size={16} color="#9aa5b8"/>
            <input
              type="text"
              value={q}
              onChange={e => setQ(e.target.value)}
              placeholder="Buscar por especialidad o apellido…"
              style={{ flex: 1, border: 'none', outline: 'none', fontSize: 14, color: '#1a2540', background: 'transparent' }}
            />
            {q && (
              <button onClick={() => setQ('')} style={{ background: 'transparent', color: '#9aa5b8', display: 'flex', padding: 2 }}>
                <Icon name="close" size={14} color="#9aa5b8"/>
              </button>
            )}
          </div>
        </div>

        {/* Result count when searching */}
        {query && (
          <div style={{ fontSize: 13, color: '#3d4b63', marginBottom: 16 }}>
            {filtered.length === 0 ? 'Sin resultados' : `${filtered.length} resultado${filtered.length === 1 ? '' : 's'} para "${q}"`}
          </div>
        )}

        {/* Grid de subcomisiones */}
        {filtered.length > 0 ? (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(340px, 1fr))', gap: 18 }} className="subc-grid">
            {filtered.map((s, i) => (
              <SubcomisionCard key={i} sub={s}/>
            ))}
          </div>
        ) : (
          <div style={{
            background: 'white', border: '1px dashed #d0d8e8', borderRadius: 12,
            padding: '48px 24px', textAlign: 'center', color: '#3d4b63',
          }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: '#0d2d5e', marginBottom: 6 }}>No encontramos resultados</div>
            <div style={{ fontSize: 13.5 }}>Probá con otro término, por ejemplo: "civil", "agrimensura" o un apellido.</div>
          </div>
        )}
      </div>
    </section>
  );
};

            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>

    <>
