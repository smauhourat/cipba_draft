/* ─── TOP BAR ─── */
const TopBar = () => (
  <div style={{ background: '#0d2d5e', color: 'rgba(255,255,255,0.85)', fontSize: 13, borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
    <div style={{ maxWidth: 1200, margin: '0 auto', padding: '7px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 8 }}>
      <div style={{ display: 'flex', gap: 24, alignItems: 'center', flexWrap: 'wrap' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <Icon name="phone" size={13}/> (011) 4651-0064 / 4482-2231
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <Icon name="mail" size={13}/> info@cipba.org
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <Icon name="clock" size={13}/> Lun–Vie 9 a 16 hs
        </span>
      </div>
      <div style={{ display: 'flex', gap: 12 }}>
        <a href="#" style={{ opacity: 0.7, transition: 'opacity .2s' }} onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.7}>
          <Icon name="whatsapp" size={15} color="white"/>
        </a>
        <a href="https://colegioingenieros.org.ar" target="_blank" style={{ fontSize: 12, opacity: 0.7, display: 'flex', alignItems: 'center', gap: 4, transition: 'opacity .2s' }} onMouseEnter={e=>e.currentTarget.style.opacity=1} onMouseLeave={e=>e.currentTarget.style.opacity=.7}>
          Consejo Superior <Icon name="externalLink" size={11} color="white"/>
        </a>
      </div>
    </div>
  </div>
);

/* ─── NAVBAR ─── */
const navLinks = [
  { label: 'Inicio', href: '#inicio' },
  { label: 'Matrícula', href: '#tramites', sub: ['Nueva Matrícula', 'Reinscripción', 'Baja Temporal', 'Certificados', { label: 'Pago de Matrícula', href: 'pago-matricula.html' }] },
  { label: 'Visado', href: '#visado', sub: ['Visado Online', 'Tasas y Aranceles', 'Honorarios Mínimos', 'Visadores'] },
  { label: 'Capacitación', href: '#capacitacion' },
  { label: 'Normativa', href: '#normativa' },
  { label: 'Institucional', href: 'institucional.html', sub: ['Autoridades', 'Partidos comprendidos', 'Sedes'] },
  { label: 'Noticias', href: '#noticias' },
  { label: 'Contacto', href: '#contacto' },
];

const Navbar = ({ scrolled }) => {
  const [open, setOpen] = useState(false);
  const [activeMenu, setActiveMenu] = useState(null);

  return (
    <nav style={{
      position: 'sticky', top: 0, zIndex: 100,
      background: scrolled ? 'rgba(13,45,94,0.98)' : '#1a4a8a',
      backdropFilter: 'blur(8px)',
      boxShadow: scrolled ? '0 2px 20px rgba(0,0,0,0.25)' : 'none',
      transition: 'all 0.3s ease',
      borderBottom: '3px solid #2a9e2a',
    }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 }}>
        {/* Logo */}
        <a href="#inicio" style={{ display: 'flex', alignItems: 'center' }}>
          <img src="uploads/logo-cipba-vii.png" alt="CIPBA Distrito VII" style={{ height: 46, width: 'auto', filter: 'brightness(0) invert(1)' }}/>
        </a>

        {/* Desktop Nav */}
        <div style={{ display: 'flex', gap: 2, alignItems: 'center' }} className="desktop-nav">
          {navLinks.map(link => (
            <div key={link.label} style={{ position: 'relative' }}
              onMouseEnter={() => setActiveMenu(link.label)}
              onMouseLeave={() => setActiveMenu(null)}>
              <a href={link.href} style={{
                color: 'rgba(255,255,255,0.88)', fontSize: 13.5, fontWeight: 600,
                padding: '8px 12px', display: 'flex', alignItems: 'center', gap: 3,
                borderRadius: 4, transition: 'all 0.2s',
                background: activeMenu === link.label ? 'rgba(255,255,255,0.12)' : 'transparent',
                letterSpacing: 0.3,
              }}>
                {link.label}
                {link.sub && <Icon name="chevronDown" size={13} color="rgba(255,255,255,0.6)"/>}
              </a>
              {link.sub && activeMenu === link.label && (
                <div style={{
                  position: 'absolute', top: '100%', left: 0, minWidth: 200,
                  background: 'white', boxShadow: '0 8px 32px rgba(0,0,0,0.15)',
                  borderRadius: 6, overflow: 'hidden', border: '1px solid rgba(0,0,0,0.08)',
                  borderTop: '3px solid #2a9e2a',
                }}>
                  {link.sub.map(s => {
                    const subLabel = typeof s === 'string' ? s : s.label;
                    const subHref = typeof s === 'string' ? '#' : s.href;
                    return (
                      <a key={subLabel} href={subHref} style={{
                        display: 'block', padding: '10px 16px', fontSize: 13.5,
                        color: '#1a2540', borderBottom: '1px solid #f0f2f7',
                        transition: 'background 0.15s',
                      }}
                      onMouseEnter={e => e.currentTarget.style.background = '#e8f1fc'}
                      onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                        {subLabel}
                      </a>
                    );
                  })}
                </div>
              )}
            </div>
          ))}
          <a href="https://colegioingenieros.org.ar/visado" target="_blank" style={{
            background: '#2a9e2a', color: 'white', fontSize: 13, fontWeight: 700,
            padding: '8px 16px', borderRadius: 5, marginLeft: 8,
            transition: 'background 0.2s', display: 'flex', alignItems: 'center', gap: 5,
          }}
          onMouseEnter={e=>e.currentTarget.style.background='#1f7a1f'}
          onMouseLeave={e=>e.currentTarget.style.background='#2a9e2a'}>
            Visado Online <Icon name="externalLink" size={13} color="white"/>
          </a>
        </div>

        {/* Mobile burger */}
        <button onClick={() => setOpen(!open)} style={{ background: 'none', color: 'white', display: 'none' }} className="mobile-burger">
          <Icon name={open ? 'close' : 'menu'} size={26}/>
        </button>
      </div>

      {/* Mobile menu */}
      {open && (
        <div style={{ background: '#0d2d5e', borderTop: '1px solid rgba(255,255,255,0.1)', padding: '8px 0 16px' }}>
          {navLinks.map(link => (
            <a key={link.label} href={link.href} onClick={() => setOpen(false)} style={{
              display: 'block', padding: '11px 24px', color: 'rgba(255,255,255,0.88)',
              fontSize: 15, borderBottom: '1px solid rgba(255,255,255,0.06)',
            }}>
              {link.label}
            </a>
          ))}
        </div>
      )}
    </nav>
  );
};

/* ─── HERO ─── */
const Hero = ({ tweaks }) => {
  const [slide, setSlide] = useState(0);
  const slides = [
    {
      tag: "Trámites digitales",
      title: "Visado Online para Ingenieros Matriculados",
      desc: "Realizá el visado de tus trabajos profesionales en línea, cualquier día del año, con descuento del 20% sobre la tasa presencial.",
      cta: "Acceder al sistema",
      cta2: "Cómo funciona",
      bg: "linear-gradient(135deg, #0d2d5e 0%, #1a4a8a 60%, #2563b0 100%)",
    },
    {
      tag: "Matrícula profesional",
      title: "Habilitá tu ejercicio profesional en el Distrito VII",
      desc: "Inscribite al Colegio de Ingenieros y ejercé legalmente tu profesión en los 24 partidos del Distrito VII de la Provincia de Buenos Aires.",
      cta: "Solicitar matrícula",
      cta2: "Requisitos",
      bg: "linear-gradient(135deg, #0a2247 0%, #0d2d5e 50%, #14458a 100%)",
    },
    {
      tag: "Capacitación",
      title: "Cursos y formación continua para profesionales",
      desc: "Mantenete actualizado con nuestros cursos de posgrado, seminarios técnicos y jornadas de capacitación continua.",
      cta: "Ver oferta académica",
      cta2: "Inscribirse",
      bg: "linear-gradient(135deg, #0d2d5e 0%, #1e3c6e 60%, #1a5590 100%)",
    },
    {
      tag: "Pagos",
      title: "Pagá tu matrícula de forma simple y segura",
      desc: "Elegí entre transferencia bancaria, débito automático, Red Link o Pagomiscuentas para mantener tu matrícula al día.",
      cta: "Ver medios de pago",
      cta2: "Cómo pagar",
      ctaHref: "pago-matricula.html",
      cta2Href: "pago-matricula.html#modalidades",
      bg: "linear-gradient(135deg, #0a2247 0%, #0d2d5e 55%, #1a4a8a 100%)",
    },
  ];
  const s = slides[slide];

  useEffect(() => {
    const t = setInterval(() => setSlide(p => (p+1) % slides.length), 6000);
    return () => clearInterval(t);
  }, []);

  return (
    <section id="inicio" style={{ position: 'relative', overflow: 'hidden', minHeight: 520 }}>
      <div style={{ background: s.bg, transition: 'background 0.8s ease', minHeight: 520, display: 'flex', alignItems: 'center', position: 'relative' }}>
        {/* Decorative pattern */}
        <div style={{ position: 'absolute', inset: 0, opacity: 0.05, backgroundImage: "url(\"data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E\")" }}/>
        <div style={{ position: 'absolute', right: 0, top: 0, width: '45%', height: '100%', background: 'linear-gradient(90deg, transparent, rgba(255,255,255,0.03))', pointerEvents: 'none' }}/>

        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '64px 24px', position: 'relative', zIndex: 1, width: '100%' }}>
          <div style={{ maxWidth: 680 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'rgba(42,158,42,0.2)', border: '1px solid rgba(42,158,42,0.4)', borderRadius: 20, padding: '5px 14px', marginBottom: 20 }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: '#2a9e2a' }}/>
              <span style={{ color: '#d4f0d4', fontSize: 13, fontWeight: 600, letterSpacing: 0.5 }}>{s.tag}</span>
            </div>
            <h1 style={{ color: 'white', fontSize: 'clamp(26px, 4vw, 44px)', fontWeight: 900, lineHeight: 1.15, marginBottom: 20, textWrap: 'pretty' }}>
              {s.title}
            </h1>
            <p style={{ color: 'rgba(255,255,255,0.78)', fontSize: 17, lineHeight: 1.65, marginBottom: 36, maxWidth: 580, textWrap: 'pretty' }}>
              {s.desc}
            </p>
            <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
              <a href={s.ctaHref || '#tramites'} style={{
                background: '#2a9e2a', color: 'white', padding: '13px 28px', borderRadius: 6,
                fontWeight: 700, fontSize: 15, display: 'flex', alignItems: 'center', gap: 8,
                transition: 'all 0.2s', boxShadow: '0 4px 16px rgba(42,158,42,0.4)',
              }}
              onMouseEnter={e=>{e.currentTarget.style.background='#1f7a1f'; e.currentTarget.style.transform='translateY(-2px)'}}
              onMouseLeave={e=>{e.currentTarget.style.background='#2a9e2a'; e.currentTarget.style.transform='none'}}>
                {s.cta} <Icon name="chevronRight" size={16} color="white"/>
              </a>
              <a href={s.cta2Href || '#institucional'} style={{
                background: 'transparent', color: 'white', padding: '13px 24px', borderRadius: 6,
                fontWeight: 600, fontSize: 15, border: '1px solid rgba(255,255,255,0.4)',
                transition: 'all 0.2s',
              }}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.1)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                {s.cta2}
              </a>
            </div>
          </div>
        </div>

        {/* Slide indicators */}
        <div style={{ position: 'absolute', bottom: 24, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
          {slides.map((_, i) => (
            <button key={i} onClick={() => setSlide(i)} style={{
              width: i === slide ? 28 : 8, height: 8, borderRadius: 4,
              background: i === slide ? '#2a9e2a' : 'rgba(255,255,255,0.35)',
              transition: 'all 0.3s', border: 'none',
            }}/>
          ))}
        </div>
      </div>

      {/* Stats strip */}
      <div style={{ background: 'white', borderBottom: '1px solid #e8f1fc', boxShadow: '0 4px 20px rgba(0,0,0,0.06)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', padding: '0 24px', display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)' }}>
          {[
            { n: '+8.500', label: 'Matriculados activos' },

      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({type: '__edit_mode_available'}, '*');
  }, []);

  return (
    <>
      <style>{`
        @media (max-width: 768px) {
          .desktop-nav { display: none !important; }
          .mobile-burger { display: flex !important; }
        }
        @media (max-width: 900px) {
          #institucional > div { grid-template-columns: 1fr !important; }
          #contacto > div > div:last-child { grid-template-columns: 1fr !important; }
        }
        @media (max-width: 640px) {
          footer > div > div:first-child { grid-template-columns: 1fr 1fr !important; }
        }
        @media (max-width: 860px) {
          .reg-row { grid-template-columns: 44px 1fr auto !important; }
          .reg-date, .reg-size { display: none !important; }
          #normativa .reg-row > div:last-child a span { display: none; }
        }
        @media (max-width: 900px) {
          #normativa div[style*="grid-template-columns: 1fr 280px"] { grid-template-columns: 1fr !important; }
        }
      `}</style>
      <TopBar/>
      <Navbar scrolled={scrolled}/>
      <Hero tweaks={tweaks}/>
      <QuickAccess/>
      <Noticias/>
      <VisadoBanner/>
      <Capacitacion/>
      <Reglamentaciones/>
      <Institucional/>
      <Contacto/>
      <Footer/>
      <TweaksPanel visible={tweaksVisible} tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
