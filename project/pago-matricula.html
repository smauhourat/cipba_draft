          <a href="inscripcion.html" onClick={() => setOpen(false)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, margin: '16px 24px 0', background: '#14484a', color: 'white', fontSize: 14.5, fontWeight: 700, padding: '13px', borderRadius: 6 }}>

const CopyBtn = ({ text }) => {
  const [ok, setOk] = useState(false);
  const copiar = () => {
    const done = () => { setOk(true); setTimeout(() => setOk(false), 1600); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
    else done();
  };
  return (
    <button onClick={copiar} aria-label={ok ? 'Copiado' : 'Copiar dato'} title={ok ? '¡Copiado!' : 'Copiar'} style={{
      display: 'inline-flex', alignItems: 'center', gap: 5, background: ok ? '#e8f5f1' : 'white',
      border: `1px solid ${ok ? '#00a48a' : '#c0e2ca'}`, borderRadius: 6, padding: '5px 9px',
      fontSize: 11.5, fontWeight: 700, color: ok ? '#00705e' : '#1a5f5c', transition: 'all .2s', flexShrink: 0,
    }}>
      <Icon name={ok ? 'check' : 'copy'} size={13} color={ok ? '#00705e' : '#1a5f5c'}/> {ok ? 'Copiado' : 'Copiar'}
    </button>
  );
};
