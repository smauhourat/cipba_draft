const getInitials = (nombre) => {
  const parts = nombre.trim().split(/\s+/);
  const apellido = parts[parts.length - 1];
  const first = parts[0];
  return (first[0] + apellido[0]).toUpperCase();
};

/* ─── LISTADO ─── */
const Listado = () => {
  const [q, setQ] = useState('');
  const query = q.trim().toLowerCase();
  const filtered = useMemo(() => {
    if (!query) return subcomisiones;
    return subcomisiones.filter(s =>
      s.nombre.toLowerCase().includes(query) ||
      s.tag.toLowerCase().includes(query) ||
      s.referentes.some(r => r.nombre.toLowerCase().includes(query) || r.email.toLowerCase().includes(query))
    );
  }, [query]);

  const totalRef = subcomisiones.reduce((acc, s) => acc + s.referentes.length, 0);

  return (
    <section id="listado" style={{ background: '#f7faf9', padding: '56px 24px 72px' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
