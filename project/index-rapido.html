<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CIPBA – Distrito VII | Colegio de Ingenieros PBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet"/>
<script defer src="vendor/react.production.min.js"></script>
<script defer src="vendor/react-dom.production.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue-deep:   #14484a;
    --blue-mid:    #1a5f5c;
    --blue-light:  #00a48a;
    --blue-pale:   #e8f5f1;
    --gold:        #00a48a;
    --gold-light:  #c0e2ca;
    --white:       #f7faf9;
    --gray-light:  #eef2f1;
    --gray-mid:    #9aa8a9;
    --gray-text:   #4a6062;
    --text:        #373d3e;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Lato', sans-serif; background: var(--white); color: var(--text); overflow-x: hidden; }
  a { text-decoration: none; color: inherit; }
  button { cursor: pointer; border: none; font-family: inherit; }
  img { display: block; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--gray-light); }
  ::-webkit-scrollbar-thumb { background: var(--blue-mid); border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script defer src="app.js"></script>
</body>
</html>
