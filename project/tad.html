<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TAD · Tribunal de Arbitraje | CIPBA – Distrito VII</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:#f7faf9;color:#373d3e;overflow-x:hidden}
a{text-decoration:none;color:inherit}
a:hover{color:#00705e}
button{cursor:pointer;border:none;font-family:inherit}
ol,ul{list-style:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#eef2f1}
::-webkit-scrollbar-thumb{background:#1a5f5c;border-radius:3px}
@media (max-width:1160px){.desktop-nav{display:none !important}.mobile-burger{display:flex !important}}
@media (max-width:1000px){.foot-grid{grid-template-columns:1fr 1fr !important}.foot-grid > div:first-child{grid-column:span 2}}
@media (max-width:760px){.doc-row{grid-template-columns:auto 1fr !important;gap:14px !important;padding:18px 18px 20px !important}.doc-cta{grid-column:2;justify-self:start !important;margin-top:4px}.norm-head{padding:26px 16px 20px !important}.norm-body{padding:24px 16px 48px !important}.crumbs{padding:10px 16px !important}}
@media (max-width:640px){.foot-grid{grid-template-columns:1fr !important}.foot-grid > div:first-child{grid-column:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tramites-shell.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { TopBar, Navbar, Footer, Icon, HeaderStyles } = window;

const resoluciones = [
  { title: 'Res. N.º 1433 — Reglamento de Tribunales Arbitrales', desc: 'Reglamento que regula la constitución y el funcionamiento de los Tribunales Arbitrales del Colegio.', meta: ['PDF', 'Consejo Superior'], href: 'docs/res-1433-reglamento-tribunales-arbitrales.pdf' },
  { title: 'Disposición N.º 80 — Complementaria de arbitraje (Res. 1433)', desc: 'Disposición complementaria que precisa aspectos operativos del Reglamento de Tribunales Arbitrales.', meta: ['PDF', 'Consejo Superior'], href: 'docs/disposicion-80-complementaria-arbitraje-res-1433.pdf' },
];

const DocRow = ({ d }) => {
  const [h, setH] = useState(false);
  return (
    <a href={d.href} target="_blank" rel="noopener" className="doc-row" onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{
      display: 'grid', gridTemplateColumns: 'auto 1fr auto', alignItems: 'center', gap: 20,
      background: 'white', border: `1px solid ${h ? '#00a48a' : '#e8f5f1'}`, borderRadius: 10,
      padding: '20px 24px', transition: 'all .22s ease',
      boxShadow: h ? '0 8px 24px rgba(20,72,74,0.10)' : '0 2px 8px rgba(0,0,0,0.04)',
    }}>
      <span style={{ width: 44, height: 44, borderRadius: 8, background: h ? '#00a48a' : '#e8f5f1', display: 'grid', placeItems: 'center', transition: 'background .22s', flexShrink: 0 }}>
        <Icon name="file" size={20} color={h ? 'white' : '#00705e'}/>
      </span>
      <div style={{ minWidth: 0 }}>
        <h3 style={{ fontFamily: "'Roboto Condensed', sans-serif", fontSize: 19, fontWeight: 700, color: '#14484a', lineHeight: 1.25, marginBottom: 5, textWrap: 'pretty' }}>{d.title}</h3>
        <p style={{ fontSize: 14.5, color: '#607a7c', lineHeight: 1.6, textWrap: 'pretty', marginBottom: 8 }}>{d.desc}</p>
        <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
          {d.meta.map(m => <span key={m} style={{ fontSize: 12, color: '#9aa8a9', fontWeight: 700, letterSpacing: 0.3 }}>{m}</span>)}
        </div>
      </div>
      <span className="doc-cta" style={{ justifySelf: 'end', display: 'flex', alignItems: 'center', gap: 6, fontSize: 13.5, fontWeight: 800, color: h ? '#00705e' : '#14484a', whiteSpace: 'nowrap', transition: 'color .2s' }}>
        Abrir <Icon name="chevronRight" size={14} color={h ? '#00705e' : '#14484a'}/>
      </span>
    </a>
  );
};

const FormularioCard = () => {
  const [h, setH] = useState(false);
  return (
    <a href="docs/tad-formulario.pdf" target="_blank" rel="noopener" onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)} style={{
      display: 'inline-flex', alignItems: 'center', gap: 10, padding: '14px 22px', borderRadius: 8,
      background: h ? '#005e4f' : '#00705e', color: 'white', fontWeight: 800, fontSize: 14.5, transition: 'background .2s',
    }}>
      <Icon name="download" size={16} color="white"/> Descargar formulario
    </a>
  );
};

const MailCard = () => (
  <a href="mailto:trib.arbitral7@cipba.org" style={{ display: 'flex', alignItems: 'center', gap: 10, fontSize: 14.5, fontWeight: 700, color: '#14484a' }}>
    <Icon name="mail" size={16} color="#00a48a"/> Mail de contacto: <span style={{ color: '#00a48a' }}>trib.arbitral7@cipba.org</span>
  </a>
);

const App = () => {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <>
      <HeaderStyles/>
      <TopBar/>
      <Navbar scrolled={scrolled}/>

      <div style={{ background: 'white', borderBottom: '1px solid #e8f5f1' }}>
        <div className="crumbs" style={{ maxWidth: 1200, margin: '0 auto', padding: '11px 24px', display: 'flex', alignItems: 'center', gap: 8, fontSize: 12.5, color: '#9aa8a9', flexWrap: 'wrap' }}>
          <a href="index.html" style={{ display: 'flex', alignItems: 'center', gap: 5 }}><Icon name="home" size={12}/> Inicio</a>
          <Icon name="chevronRight" size={11} color="#c3d2d1"/>
          <span style={{ color: '#4a6062', fontWeight: 700 }}>TAD</span>
        </div>
      </div>

      <header style={{ background: 'white' }}>
        <div className="norm-head" style={{ maxWidth: 1200, margin: '0 auto', padding: '34px 24px 26px' }}>
          <h1 style={{ color: '#14484a', fontFamily: "'Roboto Condensed', sans-serif", fontSize: 'clamp(26px, 6vw, 44px)', fontWeight: 900, lineHeight: 1.1, letterSpacing: -0.5 }}>TAD</h1>
          <p style={{ marginTop: 12, color: '#607a7c', fontSize: 'clamp(14.5px, 3.4vw, 16.5px)', lineHeight: 1.6, maxWidth: 720, textWrap: 'pretty' }}>Tribunal de Árbitros y Amigables Componedores del Distrito VII. Normativa que regula su funcionamiento, formulario de inicio y contacto directo.</p>
        </div>
      </header>

      <section className="norm-body" style={{ background: '#f7faf9', borderTop: '1px solid #eef2f1', padding: '34px 24px 60px' }}>
        <div style={{ maxWidth: 900, margin: '0 auto', display: 'grid', gap: 28 }}>
          <div>
            <div style={{ fontSize: 11.5, fontWeight: 800, letterSpacing: 1, textTransform: 'uppercase', color: '#9aa8a9', marginBottom: 14 }}>Resoluciones</div>
            <div style={{ display: 'grid', gap: 14 }}>
              {resoluciones.map(d => <DocRow key={d.title} d={d}/>)}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 22, flexWrap: 'wrap', padding: '22px 24px', background: 'white', border: '1px solid #e8f5f1', borderRadius: 10 }}>
            <FormularioCard/>
            <MailCard/>
          </div>
        </div>
      </section>

      <Footer/>
    </>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
